# Media stack for Nautilus (Bazzite, rootful Podman, run with podman-compose).
# See INSTALL.md for bring-up and README.md for day-to-day notes.
#
# podman-compose, not docker-compose: docker-compose talking to Podman's API
# silently drops CDI GPU devices, so Jellyfin would lose NVENC.
#
# SELinux is enforcing on Bazzite. Every bind mount of our own directories
# carries :z (shared container label) so all containers can read them.
# Never put :z on system paths like /etc/localtime.

# Explicit upstream DNS for containers on the compose network. Without it,
# containers copy the host's resolv.conf at start; if they come up before the
# host's DNS does (e.g. on boot), every lookup fails until they're restarted.
x-dns: &dns
  dns:
    - ${CONTAINER_DNS:-1.1.1.1}

services:
  # ---------------------------------------------------------------------------
  # Gluetun — VPN gateway (ProtonVPN via WireGuard). qBittorrent routes through
  # this container's network. If Gluetun dies, qBittorrent loses all network =
  # no IP leak.
  # ---------------------------------------------------------------------------
  gluetun:
    image: docker.io/qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"   # qBittorrent WebUI (exposed here because qbit shares this netns)
      - "6881:6881"   # torrent TCP
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT:-./config}/gluetun:/gluetun:z
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      # Get key from ProtonVPN: Account > WireGuard configuration. Paste private key.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Optional: pin to specific country/server. Leave blank for auto.
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Netherlands}
      # ProtonVPN port forwarding (paid plan). Lets peers connect = better seeding.
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Push the forwarded port into qBittorrent's listen_port automatically,
      # since ProtonVPN assigns a new port on every reconnect. Requires
      # qBittorrent's "bypass auth for localhost" WebUI setting to be on
      # (qbittorrent shares this container's network namespace).
      - VPN_PORT_FORWARDING_UP_COMMAND=/gluetun/port-sync.sh {{PORTS}}
      - TZ=${TZ:-America/New_York}
      # Subnets allowed to reach the WebUI: LAN plus the tailnet (see .env).
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.168.1.0/24}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # qBittorrent — shares Gluetun network namespace. NO own ports/networks.
  # All traffic exits via VPN. Reach WebUI at http://<host>:8080
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config:z
      - ${MEDIA_ROOT:-./data}/torrents:/data/torrents:z
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FlareSolverr — solves Cloudflare challenges for indexers that need it
  # (e.g. 1337x, Pirate Bay). Configure as an Indexer Proxy in Prowlarr
  # pointing at http://flaresolverr:8191/
  # ---------------------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    <<: *dns
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-America/New_York}
    ports:
      - "8191:8191"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Prowlarr — indexer manager. Feeds Radarr/Sonarr.
  # ---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    <<: *dns
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config:z
    ports:
      - "9696:9696"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Radarr — movies.
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *dns
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config:z
      - ${MEDIA_ROOT:-./data}:/data:z
    ports:
      - "7878:7878"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Sonarr — TV.
  # ---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *dns
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config:z
      - ${MEDIA_ROOT:-./data}:/data:z
    ports:
      - "8989:8989"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jellyfin — media server. NVENC transcoding on the RTX 4070 Ti via CDI
  # (spec generated by nvidia-cdi-generate.service). Turn it on in
  # Dashboard > Playback > Transcoding > Hardware acceleration: NVIDIA NVENC.
  # ---------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    <<: *dns
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL:-http://192.168.1.10:8096}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config:z
      - ${MEDIA_ROOT:-./data}/media:/data/media:z
    ports:
      - "8096:8096"     # HTTP
      - "8920:8920"     # HTTPS (optional)
      - "7359:7359/udp" # client auto-discovery
      - "1900:1900/udp" # DLNA
    devices:
      - nvidia.com/gpu=all
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Immich — photos. Four containers, adapted from Immich's own compose file
  # for the release pinned in IMMICH_VERSION. When bumping the version, diff
  # against https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
  # (the redis/postgres images are pinned to match each release).
  # Machine learning runs on the CPU on purpose: the GPU stays free for games.
  # ---------------------------------------------------------------------------
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.4.2}
    container_name: immich_server
    environment:
      - TZ=${TZ:-America/New_York}
      - DB_HOSTNAME=immich-database
      - DB_USERNAME=postgres
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-./data/photos}:/data:z
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2283:2283"
    depends_on:
      - immich-redis
      - immich-database
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.4.2}
    container_name: immich_machine_learning
    environment:
      - MACHINE_LEARNING_MODEL_REVISION=v2
    volumes:
      - immich-model-cache:/cache
    # Leave cores free for games during big imports.
    cpus: 6
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich_redis
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      # On the NVMe (CONFIG_ROOT), not the DAS: Postgres wants fast random IO.
      - ${CONFIG_ROOT:-./config}/immich/postgres:/var/lib/postgresql/data:z
    shm_size: 128mb
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Navidrome — music (Subsonic-compatible clients).
  # ---------------------------------------------------------------------------
  navidrome:
    image: docker.io/deluan/navidrome:latest
    container_name: navidrome
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/navidrome:/data:z
      - ${MEDIA_ROOT:-./data}/media/music:/music:ro,z
    ports:
      - "4533:4533"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Audiobookshelf — audiobooks and podcasts.
  # ---------------------------------------------------------------------------
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    <<: *dns
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/audiobookshelf/config:/config:z
      - ${CONFIG_ROOT:-./config}/audiobookshelf/metadata:/metadata:z
      - ${MEDIA_ROOT:-./data}/media/audiobooks:/audiobooks:z
      - ${MEDIA_ROOT:-./data}/media/podcasts:/podcasts:z
    ports:
      - "13378:80"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Samba — file shares over the LAN and tailnet (\\nautilus\media, \\nautilus\files).
  # Network discovery is off (it needs host networking); connect by name.
  # Files are written as PUID, so the *arr apps can still manage them.
  # ---------------------------------------------------------------------------
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    environment:
      - TZ=${TZ:-America/New_York}
      - AVAHI_DISABLE=1
      - WSDD2_DISABLE=1
      - NETBIOS_DISABLE=1
      - ACCOUNT_${SAMBA_USER}=${SAMBA_PASSWORD}
      - UID_${SAMBA_USER}=${PUID:-1000}
      - SAMBA_VOLUME_CONFIG_media=[media]; path=/shares/media; valid users = ${SAMBA_USER}; guest ok = no; read only = no; browseable = yes
      - SAMBA_VOLUME_CONFIG_files=[files]; path=/shares/files; valid users = ${SAMBA_USER}; guest ok = no; read only = no; browseable = yes
    volumes:
      - ${MEDIA_ROOT:-./data}/media:/shares/media:z
      - ${FILES_ROOT:-./data/files}:/shares/files:z
    ports:
      - "445:445"
    restart: unless-stopped

volumes:
  immich-model-cache:
